<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title style="text-align: center;">Buscar Músicas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Busca Last.fm</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-toolbar>
    <ion-searchbar 
      [(ngModel)]="searchTerm" 
      (ionChange)="onSearch()" 
      placeholder="Digite o nome da música"
      [debounce]="500"
    ></ion-searchbar>
  </ion-toolbar>

  <div *ngIf="isSearching" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Buscando...</p>
  </div>

  <ion-list *ngIf="!isSearching">
    <ion-item *ngIf="searchTerm && searchResults.length === 0">
      <ion-label>Nenhum resultado encontrado para "{{ searchTerm }}"</ion-label>
    </ion-item>
    
    <ion-item *ngFor="let track of searchResults">
      <ion-label>
        <h2>{{ track.name }}</h2>
        <p>Artista: {{ track.artist }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
  
  <div *ngIf="!searchTerm && !isSearching" class="ion-text-center ion-padding">
    <p>Digite algo para começar a buscar músicas.</p>
  </div>
</ion-content>
