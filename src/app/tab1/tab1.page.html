<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Ranking Global</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Top 20 Tracks</ion-title>
    </ion-toolbar>
  </ion-header>

  <div *ngIf="loading" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
    <p>Carregando ranking...</p>
  </div>

  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let track of topTracks; let i = index">
      <ion-label>
        <h2>{{ i + 1 }}. {{ track.name }}</h2>
        <p>Artista: {{ track.artist.name }}</p>
        <p>Ouvintes: {{ track.listeners | number }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
